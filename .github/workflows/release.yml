name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $inno)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }

      - name: Check version, source repository and release notes
        run: |
          python tools/make_update_manifest.py --repository $env:GITHUB_REPOSITORY --check-tag $env:GITHUB_REF_NAME --validate-only
          if ($LASTEXITCODE -ne 0) { throw "Release metadata validation failed" }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Build application, installer and update manifest
        run: |
          ./tools/build_release.ps1 -Python (Get-Command python).Source -Repository $env:GITHUB_REPOSITORY

      - name: Verify driver replacement without unnecessary restart
        run: |
          python tools/test_installer_driver.py
          if ($LASTEXITCODE -ne 0) { throw "Installer driver regression test failed" }

      - name: Smoke test packaged application
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python tools/smoke_packaged.py
          if ($LASTEXITCODE -ne 0) { throw "Packaged application smoke test failed" }

      - name: Upload assets to a draft and publish when complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = python -c "from netlab import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read release version" }
          $assets = @(
            "deliverables/MotuNet-$version-Setup-x64.exe",
            "deliverables/MotuNet-$version-Setup-x64.exe.sha256",
            "deliverables/latest.json"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          # A failed upload remains a draft, so clients never see an incomplete release.
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "Motu Net $version" --notes-file deliverables/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Cannot create draft release (an existing release is not overwritten)" }
          gh release upload $env:GITHUB_REF_NAME @assets
          if ($LASTEXITCODE -ne 0) { throw "Upload failed; release remains a draft" }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Assets uploaded, but publishing the draft failed" }
